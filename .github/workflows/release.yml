name: Release

# Ways to publish:
#  1. Actions tab -> Release -> Run workflow: pick bump (patch/minor/major) and channel
#     (stable/beta). The version is bumped, committed, tagged, built and published.
#  2. Push a tag yourself (planner/__init__.py must already contain that version):
#        git tag v1.2.0 && git push origin v1.2.0
#  3. Rolling beta: uncomment `branches: [main]` below and every push to main
#     publishes the next beta automatically.
# Installed apps on the matching channel are offered the update within ~6 hours.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta]
        default: stable
      compiler:
        description: "Build with"
        type: choice
        options: [nuitka, pyinstaller]
        default: nuitka
  push:
    tags: ["v*"]
    # branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            code=$(python -c "import planner; print(planner.__version__)")
            if [[ "$code" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match planner.__version__ ($code)"; exit 1
            fi
          else
            bump="${{ inputs.bump || 'patch' }}"
            channel="${{ inputs.channel || 'beta' }}"     # push to main => rolling beta
            version=$(python scripts/bump_version.py "$bump" "$channel")
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$version [skip ci]"
            git tag "v$version"
            git push origin "HEAD:$GITHUB_REF_NAME" "v$version"
          fi
          [[ "$version" == *-* ]] && pre=true || pre=false
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "tag=v$version"      >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre"    >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease=$pre)"

  build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        shell: pwsh
        # Tag pushes have no inputs, so default to the native (Nuitka) build there.
        run: ./build.ps1 -Compiler "${{ github.event.inputs.compiler || 'nuitka' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ZuqongtechPlanner-Setup-${{ needs.prepare.outputs.version }}
          path: dist/installer/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Daily Planner ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/installer/*.exe
            dist/installer/*.sha256

      # The app polls releases/download/update-feed/<channel>.json (no API rate limit).
      - name: Update the in-app update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.prerelease == 'true' && 'beta' || 'stable' }}
        run: |
          set -euo pipefail
          mkdir -p feed
          gh release view update-feed >/dev/null 2>&1 || gh release create update-feed \
            --prerelease --title "Update feed (used by the app, do not delete)" \
            --notes "Machine-readable update manifests polled by installed copies of Daily Planner."
          gh release download update-feed --dir feed --pattern "*.json" || true
          gh release view "$TAG" --json body --jq .body > feed/notes.md
          python scripts/make_manifest.py --repo "$GITHUB_REPOSITORY" --version "$VERSION" --tag "$TAG" \
            --installer "dist/installer/ZuqongtechPlanner-Setup-$VERSION.exe" \
            --notes feed/notes.md --channel "$CHANNEL" --feed feed
          gh release upload update-feed feed/*.json --clobber
